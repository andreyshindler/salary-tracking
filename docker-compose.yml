services:
  bot:
    build: .
    image: salary-tracking:latest
    container_name: salary-bot
    restart: unless-stopped

    # Proper PID 1: reaps zombies and forwards SIGTERM so the bot shuts down
    # cleanly instead of being killed after the grace period.
    init: true
    stop_grace_period: 20s

    env_file: .env
    environment:
      DB_PATH: /data/salary.db
      TZ: Asia/Jerusalem
      WEBAPP_PORT: 8080

    # The Mini App server. Only listening when WEBAPP_URL is set; point your
    # reverse proxy at the host port and give it a certificate, since Telegram
    # will not open anything but HTTPS. Bound to localhost so nothing is
    # exposed directly — remove the 127.0.0.1 prefix only if the proxy is
    # elsewhere.
    #
    # Host 8096 rather than 8080: 8080 is a popular default and is often
    # already taken on a box running several services. Change the left-hand
    # number if it clashes, and point the proxy at whatever you pick.
    ports:
      - "127.0.0.1:8096:8080"

    # A bind mount rather than a named volume: deploy/backup.sh then works
    # unchanged against ./data/salary.db, and the file can be copied off the
    # box without going through docker.
    volumes:
      - ./data:/data

    # Without rotation a long-running poller fills the disk over months.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
