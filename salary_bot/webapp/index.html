<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יומן שעות</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Colours come from Telegram's theme so the app matches the client in both
     light and dark, rather than fighting it. */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #999999);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --item-h: 40px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px 12px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 16px;
  }
  h2 { font-size: 17px; margin: 0; font-weight: 600; }

  .card {
    background: var(--secondary-bg);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 14px;
  }

  /* ---------------------------------------------------------- month header */
  .month-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month-bar button {
    background: none; border: 0; color: var(--link);
    font-size: 22px; padding: 4px 14px; cursor: pointer; line-height: 1;
  }

  /* --------------------------------------------------------------- calendar */
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 12px; color: var(--hint); padding: 4px 0; }
  .day {
    aspect-ratio: 1; border: 0; border-radius: 10px;
    background: var(--bg); color: var(--text);
    font-size: 15px; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .day.blank { background: none; cursor: default; }
  .day.rest { color: var(--link); font-weight: 600; }
  .day.today { outline: 2px solid var(--hint); }
  .day.selected { background: var(--button); color: var(--button-text); font-weight: 700; }

  /* ------------------------------------------------------------ time wheels */
  .wheels { display: flex; gap: 10px; }
  .wheel-group { flex: 1; }
  .wheel-label { font-size: 13px; color: var(--hint); margin-bottom: 6px; text-align: center; }
  .wheel-pair { display: flex; gap: 6px; position: relative; }
  /* The highlight band marks which row counts as selected. */
  .wheel-pair::after {
    content: ""; position: absolute; left: 0; right: 0;
    top: calc(var(--item-h) * 2); height: var(--item-h);
    border-radius: 8px; background: var(--button); opacity: .15;
    pointer-events: none;
  }
  .wheel {
    flex: 1; height: calc(var(--item-h) * 5);
    overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; text-align: center;
    background: var(--bg); border-radius: 8px;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel .opt {
    height: var(--item-h); line-height: var(--item-h);
    scroll-snap-align: center; font-variant-numeric: tabular-nums;
    font-size: 19px; color: var(--hint); transition: color .12s, transform .12s;
  }
  .wheel .opt.on { color: var(--text); font-weight: 700; transform: scale(1.12); }
  /* Two blank rows top and bottom so the first and last values can centre. */
  .wheel .pad { height: calc(var(--item-h) * 2); scroll-snap-align: none; }

  .summary { text-align: center; font-size: 15px; padding: 4px 0 0; }
  .summary .muted { color: var(--hint); font-size: 13px; }

  /* Hidden until something goes wrong. A silent failure here would look like
     the shift was saved when it was not. */
  .error {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: #b3261e; color: #ffffff; font-size: 14px; line-height: 1.4;
  }
  .error.shown { display: block; }
  .warn { color: #d1453b; }

  /* ------------------------------------------------------------- reports */
  .view[hidden] { display: none; }

  .headline { text-align: center; padding: 4px 0 2px; }
  .headline .amount { font-size: 32px; font-weight: 700; line-height: 1.1; }
  .headline .of { color: var(--hint); font-size: 14px; margin-top: 2px; }

  .bar { height: 10px; border-radius: 5px; background: var(--bg); overflow: hidden; margin: 12px 0 8px; }
  .bar > span { display: block; height: 100%; background: var(--button); border-radius: 5px; }
  .bar.over > span { background: #d1453b; }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .fact { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .fact .k { color: var(--hint); font-size: 12px; }
  .fact .v { font-size: 16px; font-weight: 600; margin-top: 2px; }

  table.rows { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rows th { color: var(--hint); font-weight: 500; font-size: 12px; text-align: right; padding: 0 4px 6px; }
  table.rows td { padding: 7px 4px; border-top: 1px solid var(--bg); text-align: right; }
  table.rows td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.rows tr.total td { font-weight: 700; border-top: 2px solid var(--bg); }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; padding: 9px 0; border: 0; border-radius: 10px; font-size: 15px;
    background: var(--secondary-bg); color: var(--text);
  }
  .tabs button.on { background: var(--button); color: var(--button-text); font-weight: 600; }

  .linkish {
    display: block; width: 100%; padding: 11px 0; border: 0; border-radius: 10px;
    background: var(--secondary-bg); color: var(--link); font-size: 15px;
  }
  .empty { color: var(--hint); text-align: center; padding: 14px 0; font-size: 14px; }
</style>
</head>
<body>

<div id="calendarView" class="view">

<div class="card">
  <div class="month-bar">
    <button id="prev" aria-label="חודש קודם">‹</button>
    <h2 id="monthName"></h2>
    <button id="next" aria-label="חודש הבא">›</button>
  </div>
  <div class="grid" id="dow"></div>
  <div class="grid" id="days"></div>
</div>

<div class="card">
  <div class="wheels">
    <div class="wheel-group">
      <div class="wheel-label">התחלה</div>
      <div class="wheel-pair">
        <div class="wheel" id="sh"></div>
        <div class="wheel" id="sm"></div>
      </div>
    </div>
    <div class="wheel-group">
      <div class="wheel-label">סיום</div>
      <div class="wheel-pair">
        <div class="wheel" id="eh"></div>
        <div class="wheel" id="em"></div>
      </div>
    </div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="error" id="error"></div>
</div>

</div><!-- /calendarView -->

<div id="reportsView" class="view" hidden>
  <div class="tabs">
    <button id="tabMonth" class="on">חודש</button>
    <button id="tabYear">שנה</button>
  </div>

  <div id="monthPane">
    <div class="card">
      <div class="month-bar">
        <button id="rPrev" aria-label="חודש קודם">‹</button>
        <h2 id="rMonthName"></h2>
        <button id="rNext" aria-label="חודש הבא">›</button>
      </div>
      <div class="headline">
        <div class="amount" id="rEarned">—</div>
        <div class="of" id="rOf"></div>
      </div>
      <div class="bar" id="rBar"><span style="width:0"></span></div>
      <div class="facts" id="rFacts"></div>
    </div>

    <div class="card">
      <h2>🧮 פילוח לפי תעריף</h2>
      <div id="rTiers"></div>
    </div>

    <div class="card">
      <h2>🗓 המשמרות</h2>
      <div id="rShifts"></div>
    </div>
  </div>

  <div id="yearPane" hidden>
    <div class="card">
      <h2 id="rYearName"></h2>
      <div id="rYear"></div>
    </div>
  </div>

  <div class="card">
    <button class="linkish" id="rExport">📤 ייצוא CSV לצ׳אט</button>
  </div>

  <div class="error" id="rError"></div>
</div>

<script>
(function () {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני",
                  "יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  const DOW = ["א","ב","ג","ד","ה","ו","ש"];   // the grid is dir=rtl, so this reads right to left

  const pad2 = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

  const today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selected = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  // Rest days the bot passed in, so חג and שבת are visible before you pick them.
  const params = new URLSearchParams(location.search);
  const restDays = new Set((params.get("rest") || "").split(",").filter(Boolean));

  // One page, two screens. The bot's menu buttons differ only by this
  // parameter, which survives every reverse-proxy arrangement — unlike a path,
  // which may or may not keep its prefix.
  const screen = params.get("view") === "reports" ? "reports" : "calendar";
  document.getElementById("calendarView").hidden = screen !== "calendar";
  document.getElementById("reportsView").hidden = screen !== "reports";

  // Requests go to api/… relative to this page's own directory: hosted at
  // /salary, they must stay inside /salary or the reverse proxy never sees them.
  const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  async function api(name, body) {
    const response = await fetch(base + "api/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign(
        { initData: (tg && tg.initData) || "" }, body || {})),
    });
    let data = null;
    try { data = await response.json(); } catch (err) { /* not JSON */ }
    if (!response.ok) {
      throw new Error((data && data.message) || `הבקשה נכשלה (${response.status}).`);
    }
    return data;
  }

  // ------------------------------------------------------------- calendar
  const dowEl = document.getElementById("dow");
  DOW.forEach(d => {
    const cell = document.createElement("div");
    cell.className = "dow";
    cell.textContent = d;
    dowEl.appendChild(cell);
  });

  function renderMonth() {
    document.getElementById("monthName").textContent =
      `${MONTHS[view.getMonth()]} ${view.getFullYear()}`;

    const days = document.getElementById("days");
    days.textContent = "";

    const first = new Date(view.getFullYear(), view.getMonth(), 1);
    const last = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();

    for (let i = 0; i < first.getDay(); i++) {          // getDay: 0 = Sunday
      const blank = document.createElement("div");
      blank.className = "day blank";
      days.appendChild(blank);
    }
    for (let d = 1; d <= last; d++) {
      const date = new Date(view.getFullYear(), view.getMonth(), d);
      const key = iso(date);
      const btn = document.createElement("button");
      btn.className = "day";
      btn.textContent = d;
      if (date.getDay() === 6 || restDays.has(key)) btn.classList.add("rest");
      if (key === iso(today)) btn.classList.add("today");
      if (key === iso(selected)) btn.classList.add("selected");
      btn.addEventListener("click", () => {
        selected = date;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        renderMonth();
        updateSummary();
      });
      days.appendChild(btn);
    }
  }

  document.getElementById("prev").addEventListener("click", () => {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    renderMonth();
  });
  document.getElementById("next").addEventListener("click", () => {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
    renderMonth();
  });

  // ---------------------------------------------------------- time wheels
  const ITEM = 40;

  function buildWheel(el, values, initial) {
    el.textContent = "";
    const top = document.createElement("div"); top.className = "pad"; el.appendChild(top);
    values.forEach(v => {
      const row = document.createElement("div");
      row.className = "opt";
      row.textContent = pad2(v);
      el.appendChild(row);
    });
    const bottom = document.createElement("div"); bottom.className = "pad"; el.appendChild(bottom);

    el.dataset.values = JSON.stringify(values);
    const index = Math.max(0, values.indexOf(initial));
    // Set after layout, or the scroll position is discarded.
    requestAnimationFrame(() => { el.scrollTop = index * ITEM; markActive(el); });

    let timer = null;
    el.addEventListener("scroll", () => {
      markActive(el);
      clearTimeout(timer);
      timer = setTimeout(() => {
        // Settle exactly on a row: momentum scrolling stops between rows.
        const i = Math.round(el.scrollTop / ITEM);
        el.scrollTo({ top: i * ITEM, behavior: "smooth" });
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        updateSummary();
      }, 120);
    });
  }

  function markActive(el) {
    const i = Math.round(el.scrollTop / ITEM);
    [...el.querySelectorAll(".opt")].forEach((opt, n) => opt.classList.toggle("on", n === i));
  }

  function wheelValue(el) {
    const values = JSON.parse(el.dataset.values);
    const i = Math.min(values.length - 1, Math.max(0, Math.round(el.scrollTop / ITEM)));
    return values[i];
  }

  const HOURS = Array.from({ length: 24 }, (_, i) => i);
  const MINUTES = Array.from({ length: 12 }, (_, i) => i * 5);
  const els = {
    sh: document.getElementById("sh"), sm: document.getElementById("sm"),
    eh: document.getElementById("eh"), em: document.getElementById("em"),
  };
  buildWheel(els.sh, HOURS, 9);
  buildWheel(els.sm, MINUTES, 0);
  buildWheel(els.eh, HOURS, 17);
  buildWheel(els.em, MINUTES, 0);

  // --------------------------------------------------------------- summary
  function times() {
    return {
      start: `${pad2(wheelValue(els.sh))}:${pad2(wheelValue(els.sm))}`,
      end: `${pad2(wheelValue(els.eh))}:${pad2(wheelValue(els.em))}`,
    };
  }

  function updateSummary() {
    const { start, end } = times();
    const [a, b] = [start, end].map(t => {
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    });
    // An end at or before the start means the shift ran past midnight.
    let minutes = b - a;
    let overnight = false;
    if (minutes <= 0) { minutes += 24 * 60; overnight = true; }

    const hours = (minutes / 60).toFixed(2).replace(/\.?0+$/, "");
    const dateLabel = selected.toLocaleDateString("he-IL", {
      weekday: "long", day: "2-digit", month: "2-digit", year: "numeric",
    });

    document.getElementById("summary").innerHTML =
      `<div>${dateLabel}</div>` +
      `<div><b>${start} – ${end}</b> · ${hours} שעות</div>` +
      (overnight ? `<div class="muted">חוצה חצות — הסיום למחרת</div>` : "");

    if (screen === "calendar" && tg && tg.MainButton) {
      tg.MainButton.setText(`שמור · ${hours} שעות`);
      if (!tg.MainButton.isVisible) tg.MainButton.show();
    }
  }

  // ------------------------------------------------------------- submitting
  // The app is launched from an inline button, and Telegram does not deliver
  // sendData from those, so the result goes back to the bot's own server.
  const errorEl = document.getElementById("error");

  function showError(text) {
    errorEl.textContent = text;
    errorEl.classList.add("shown");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    if (tg && tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.enable(); }
  }

  async function submit() {
    const { start, end } = times();
    errorEl.classList.remove("shown");
    if (tg && tg.MainButton) { tg.MainButton.showProgress(true); tg.MainButton.disable(); }

    try {
      await api("shift", { shift: JSON.stringify({ date: iso(selected), start, end }) });
    } catch (err) {
      showError(err.message);
      return;
    }

    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    if (tg) tg.close();
  }

  if (screen === "calendar" && tg && tg.MainButton) tg.MainButton.onClick(submit);

  // ---------------------------------------------------------------- reports
  const rError = document.getElementById("rError");
  let shown = null;      // {year, month} currently on screen

  function rows(header, body, empty) {
    if (!body.length) return `<div class="empty">${esc(empty)}</div>`;
    return `<table class="rows"><thead><tr>${header}</tr></thead>`
         + `<tbody>${body.join("")}</tbody></table>`;
  }

  function renderReport(data) {
    const m = data.month;
    shown = { year: m.year, month: m.month };

    document.getElementById("rMonthName").textContent = m.label;
    document.getElementById("rEarned").textContent = m.earned;
    document.getElementById("rOf").textContent = `מתוך ${m.ceiling}`;

    const bar = document.getElementById("rBar");
    bar.classList.toggle("over", m.overCeiling);
    bar.firstElementChild.style.width = m.pct + "%";

    const facts = [
      [m.overCeiling ? "חריגה מהתקרה" : "נותר עד התקרה", m.remaining],
      ["ניצול", m.pctLabel],
      ["שעות", m.hours],
      ["משמרות", String(m.shiftCount)],
      ["עוד שעות רגילות", m.overCeiling ? "—" : m.remainingBaseHours],
      ["עוד שעות שבת/חג", m.overCeiling ? "—" : m.remainingRestHours],
    ];
    if (m.crossingDate) facts.push(["צפוי לחצות את התקרה", m.crossingDate]);
    if (m.needsRate) facts.push(["⚠️ תעריף", "לא מוגדר"]);

    document.getElementById("rFacts").innerHTML = facts.map(
      ([k, v]) => `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`
    ).join("");

    document.getElementById("rTiers").innerHTML = rows(
      "<th>תעריף</th><th>שעות</th><th>סכום</th>",
      m.tiers.map(t => `<tr><td>${esc(t.pct)} · ${esc(t.label)}</td>`
                     + `<td class="num">${esc(t.hours)}</td>`
                     + `<td class="num">${esc(t.amount)}</td></tr>`),
      "אין עדיין שעות בחודש הזה.");

    document.getElementById("rShifts").innerHTML = rows(
      "<th>תאריך</th><th>שעות</th><th>סכום</th>",
      m.shifts.map(sh => `<tr><td>${esc(sh.date)} ${esc(sh.day)}`
                       + (sh.note ? ` · ${esc(sh.note)}` : "")
                       + `<div class="k" style="color:var(--hint);font-size:12px">${esc(sh.span)}</div></td>`
                       + `<td class="num">${esc(sh.hours)}</td>`
                       + `<td class="num">${esc(sh.amount)}</td></tr>`),
      "אין עדיין משמרות בחודש הזה.");

    const y = data.year;
    document.getElementById("rYearName").textContent = `🗂 סיכום ${y.year}`;
    document.getElementById("rYear").innerHTML = rows(
      "<th>חודש</th><th>שעות</th><th>סכום</th><th>ניצול</th>",
      y.rows.map(r => `<tr><td>${esc(r.short)}</td>`
                    + `<td class="num">${esc(r.hours)}</td>`
                    + `<td class="num">${esc(r.earned)}</td>`
                    + `<td class="num${r.overCeiling ? " warn" : ""}">${esc(r.pctLabel)}</td></tr>`)
        .concat(y.rows.length
          ? [`<tr class="total"><td>סה״כ</td><td class="num">${esc(y.hours)}</td>`
             + `<td class="num">${esc(y.earned)}</td><td></td></tr>`]
          : []),
      "אין עדיין משמרות השנה.");
  }

  async function loadReport(year, month) {
    rError.classList.remove("shown");
    try {
      renderReport(await api("report", year ? { year, month } : {}));
    } catch (err) {
      rError.textContent = err.message;
      rError.classList.add("shown");
    }
  }

  function stepMonth(delta) {
    if (!shown) return;
    const at = new Date(shown.year, shown.month - 1 + delta, 1);
    loadReport(at.getFullYear(), at.getMonth() + 1);
  }

  document.getElementById("rPrev").addEventListener("click", () => stepMonth(-1));
  document.getElementById("rNext").addEventListener("click", () => stepMonth(1));

  const tabMonth = document.getElementById("tabMonth");
  const tabYear = document.getElementById("tabYear");
  function showPane(which) {
    document.getElementById("monthPane").hidden = which !== "month";
    document.getElementById("yearPane").hidden = which !== "year";
    tabMonth.classList.toggle("on", which === "month");
    tabYear.classList.toggle("on", which === "year");
  }
  tabMonth.addEventListener("click", () => showPane("month"));
  tabYear.addEventListener("click", () => showPane("year"));

  document.getElementById("rExport").addEventListener("click", async () => {
    rError.classList.remove("shown");
    try {
      await api("export", shown ? { year: shown.year, month: shown.month } : {});
    } catch (err) {
      rError.textContent = err.message;
      rError.classList.add("shown");
      return;
    }
    // The file lands in the chat, which is where it is wanted — so get out of
    // the way rather than reporting success in a window about to be closed.
    if (tg) tg.close();
  });

  renderMonth();
  updateSummary();
  if (screen === "reports") loadReport();
})();
</script>
</body>
</html>
